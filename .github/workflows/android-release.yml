name: Release build (manual, signed, experimental target SDK)
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fail early when signing secrets are missing
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: test -n "$K" || (echo "RELEASE_KEYSTORE_BASE64 secret is required" && exit 1)
      - run: npm install
      - run: npm test
      - name: Upgrade Capacitor to the latest major (needed for newer targetSdk; UNTESTED)
        run: npm install @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest
      - run: npx cap add android
      - name: Cache-bust the service worker
        run: sed -i "s/agy-__BUILD__/agy-${GITHUB_RUN_NUMBER}/" www/sw.js
      - run: npx cap sync android
      - name: Landscape, fullscreen, notch
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style>#g' android/app/src/main/res/values/styles.xml
      - name: Target SDK 36 (Google Play requirement since 2026-08-31) - verify the build before publishing
        run: |
          F=android/variables.gradle
          sed -i -E 's/(targetSdkVersion *= *)[0-9]+/\136/; s/(compileSdkVersion *= *)[0-9]+/\136/' $F
          cat $F
      - name: Signing config from secrets
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$K" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cp android-config/signing.gradle android/app/signing.gradle
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
      - name: Build signed APK and AAB
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ala-ganb-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
