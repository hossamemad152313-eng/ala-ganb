name: Build APK and publish site
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack update.zip (upload ONE zip from the phone)
        run: |
          if [ -f update.zip ]; then
            rm -rf /tmp/up && mkdir /tmp/up && unzip -q update.zip -d /tmp/up
            SRC=$(dirname "$(find /tmp/up -maxdepth 3 -name package.json | head -1)")
            rm -rf www docs tests assets android-config android
            rsync -a --exclude '.github' --exclude '.git' "$SRC"/ ./
            rm -f update.zip
            ls
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Tests (logic, static, smoke)
        run: npm test
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#1f5fd1' --splashBackgroundColor '#1b1a22'
      - name: Cache-bust the service worker
        run: sed -i "s/agy-__BUILD__/agy-${GITHUB_RUN_NUMBER}/" www/sw.js
      - name: Stable debug signing key (from secret DEBUG_KEYSTORE_BASE64, optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the stable debug key from the secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set. This build is signed with a NEW random debug key, so it will not install over a previous build. See docs/ANDROID-BUILD.md."
          fi
      - run: npx cap sync android
      - name: Landscape and fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#g' android/app/src/main/res/values/styles.xml
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Assemble the website (game + APK)
        run: |
          mkdir site
          cp -r www/. site/
          cp android/app/build/outputs/apk/debug/app-debug.apk site/ala-ganb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ala-ganb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
